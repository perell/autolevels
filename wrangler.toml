name = "autolevels-agent"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

# Secrets (never commit these; set them with `npx wrangler secret put <NAME>`):
#   IG_API_KEY, IG_USERNAME, IG_PASSWORD, ADMIN_TOKEN

[vars]
# "demo" -> demo-api.ig.com, "live" -> api.ig.com
IG_ENV = "live"
# IG market used for prices (the underlying Germany 40). Check it in the market finder.
PRICE_EPIC = "IX.D.DAX.INE.IP"
# IG account the agent always uses (switched to right after login). Empty = the preferred account.
IG_ACCOUNT_ID = "EY9UA"

# --- Real trading (the switch itself is on the status page, OFF by default) ---
# Market the agent trades: Germany 40 Cash (EUR 1 per point)
TRADE_EPIC = "IX.D.DAX.INE.IP"
# Position size (IG minimum is 0.01 = EUR 0.01 per point)
TRADE_SIZE = "0.01"
# Guaranteed stop: loss stops exactly at the stop, IG charges a small premium if it is hit
GUARANTEED_STOP = "true"
# No new orders after this many trades in a day ...
MAX_TRADES_PER_DAY = "5"
# ... or after losing this many points in a day
MAX_DAILY_LOSS_POINTS = "150"
# ... or after losing this % of the day's starting balance (balance + open P&L, from IG). 0 = off.
# Open positions are left alone; only new positions are stopped.
MAX_DAILY_LOSS_PERCENT = "5"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO"]

[triggers]
# watchdog: makes sure the agent's own timer is running
crons = ["*/5 * * * *"]

[observability]
enabled = true
